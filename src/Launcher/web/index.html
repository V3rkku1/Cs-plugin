<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAN Skin Tester</title>
  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/pages/hacker.css" />
  <link rel="stylesheet" href="css/pages/play.css" />
  <link rel="stylesheet" href="css/pages/friends.css" />
  <link rel="stylesheet" href="css/pages/skins.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="grain"></div>
  </div>

  <!-- Liquid refraction for .glass.liquid: bends the backdrop a little, most at the edges. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="38" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
