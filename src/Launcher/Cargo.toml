[package]
name = "lan-skin-tester-launcher"
version = "2.19.0"
edition = "2021"
description = "LAN Skin Tester launcher (Tauri)"
publish = false

[[bin]]
name = "LanSkinTesterLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["gzip", "brotli"] }
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
chrono = "0.4"
dirs = "6"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
netdev = "0.36"
roxmltree = "0.20"
rfd = "0.15"
arboard = { version = "3", default-features = false }
open = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Registry"] }

[profile.release]
opt-level = "s"
# Thin LTO, default codegen units: a few % bigger exe, builds on every core.
lto = "thin"
strip = true
