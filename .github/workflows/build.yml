name: Build

# Builds the plugin and the Windows launcher on every push. Pushes to main also
# update the "latest" release, so the newest files are always at Releases → "Latest build".
# Tags like v2.1.0 get their own release. Other branches only upload workflow artifacts (no release).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test tests/LanSkinTester.Tests -c Release

      - name: Install NSIS (for the installer)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Build plugin, launcher and installer
        run: ./build.sh
        env:
          # Builds of other branches are for testing: they must not update themselves to the main release.
          TEST_BUILD: ${{ github.ref != 'refs/heads/csgo' && '1' || '' }}

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: LanSkinTester-${{ github.sha }}
          path: |
            build/SkinTesterCSGOSetup.exe
            build/SkinTesterCSGO.exe
            build/SkinTesterCSGO-small.zip
            build/LanSkinTester.zip
          if-no-files-found: error

      - name: Publish "Latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/csgo'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-csgo
          target_commitish: ${{ github.sha }}
          name: Latest CS:GO build
          prerelease: true
          body: |
            Newest build of the CS:GO launcher (`${{ github.ref_name }}`, commit ${{ github.sha }}).

            - **SkinTesterCSGOSetup.exe**: the installer (Start menu / desktop shortcut, uninstaller, updates itself). Easiest.
            - **SkinTesterCSGO.exe**: the launcher, one file, nothing else to install.
            - **SkinTesterCSGO-small.zip**: the same launcher, small, needs the .NET 10 Desktop Runtime.

            Needs CS:GO legacy (Steam: "Counter-Strike: Global Offensive" legacy app) and Windows Smart App Control off (SourceMod's DLLs are unsigned).
          files: |
            build/SkinTesterCSGOSetup.exe
            build/SkinTesterCSGO.exe
            build/SkinTesterCSGO-small.zip

      - name: Move the "latest" tag to this commit (after the files are up, so launchers never see a new tag with old files)
        if: github.event_name == 'push' && github.ref == 'refs/heads/csgo'
        run: |
          git tag -f latest-csgo
          git push -f origin latest-csgo

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/SkinTesterCSGOSetup.exe
            build/SkinTesterCSGO.exe
            build/SkinTesterCSGO-small.zip
            build/LanSkinTester.zip
