name: Build

# Builds the plugin and the Windows launcher on every push. Pushes to main also
# update the "latest" release, so the newest files are always at Releases → "Latest build".
# Tags like v2.1.0 get their own release. Other branches only upload workflow artifacts (no release).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The launcher is a Windows app (Tauri + WebView2): it builds on Windows. Every step runs in Git Bash.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/Launcher
          # Only main saves: every branch saving its own cache pushed main's out of the 10 GB limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run plugin tests
        run: dotnet test tests/LanSkinTester.Tests -c Release

      - name: Run launcher tests
        run: cargo test --manifest-path src/Launcher/Cargo.toml

      - name: Install NSIS (for the installer)
        run: |
          # Chocolatey's package source fails now and then: try a few times.
          for i in 1 2 3; do
            [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ] && break
            choco install nsis -y --no-progress && break
            sleep 20
          done
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Build plugin, launcher and installer
        run: ./build.sh
        env:
          # Builds of other branches are for testing: they must not update themselves to the main release.
          TEST_BUILD: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') && '1' || '' }}

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: LanSkinTester-${{ github.sha }}
          path: |
            build/LanSkinTesterSetup.exe
            build/LanSkinTesterLauncher.exe
            build/LanSkinTester.zip
          if-no-files-found: error

      - name: Publish "Latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build
          prerelease: true
          body: |
            Newest build of `${{ github.ref_name }}` (commit ${{ github.sha }}).

            - **LanSkinTesterSetup.exe**: the installer (Start menu / desktop shortcut, uninstaller, updates itself). Easiest.
            - **LanSkinTesterLauncher.exe**: the launcher, one file, nothing else to install.
            - **LanSkinTester.zip**: only the plugin, for installing by hand (extract into `game/csgo/`).
          files: |
            build/LanSkinTesterSetup.exe
            build/LanSkinTesterLauncher.exe
            build/LanSkinTester.zip

      - name: Move the "latest" tag to this commit (after the files are up, so launchers never see a new tag with old files)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/LanSkinTesterSetup.exe
            build/LanSkinTesterLauncher.exe
            build/LanSkinTester.zip
